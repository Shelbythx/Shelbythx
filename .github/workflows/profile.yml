# Шлях у репозиторії: .github/workflows/profile.yml
name: Update profile README

on:
  schedule:
    - cron: "0 3 * * *" # щодня вночі (UTC)
  workflow_dispatch: # кнопка "Run workflow" у вкладці Actions
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml", "scripts/**"] # перезапуск після зміни workflow або скрипта

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Піксельний світ з твого графіка контрибуцій (замість змійки)
      - name: Generate pixel world
        run: node scripts/pixel-world.mjs --user "${{ github.repository_owner }}" --out profile/pixel-world.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Картка статистики
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Картка мов
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
